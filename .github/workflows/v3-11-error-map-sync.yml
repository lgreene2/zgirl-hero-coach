name: v3.11 Pilot Error Map Sync
on:
  push:
    branches: [zgirl-v3.11-operational-activation-pilot-engine]
    paths: [.github/workflows/v3-11-error-map-sync.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zgirl-v3.11-operational-activation-pilot-engine
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/credentials/store.ts')
          s=p.read_text()
          old='"invalid_pilot_stage", "pilot_readiness_incomplete", "pilot_cohort_required", "pilot_facilitator_required",'
          new='"invalid_pilot_stage", "pilot_stage_transition_not_allowed", "pilot_qualification_incomplete", "pilot_readiness_incomplete", "pilot_cohort_required", "pilot_facilitator_required", "pilot_implementation_owner_required", "pilot_safety_contact_required", "pilot_executed_agreement_required", "pilot_commercial_authority_required", "pilot_evidence_required", "pilot_closeout_required", "pilot_metric_integrity_failed", "pilot_closeout_stage_required", "invalid_pilot_price", "invalid_pilot_dates", "pilot_permission_reference_required",'
          if old not in s: raise SystemExit('known pilot error anchor not found')
          s=s.replace(old,new)
          old2='"named_system_owner_required", "gls_opportunity_required", "pilot_readiness_incomplete", "pilot_cohort_required", "pilot_facilitator_required",'
          new2='"named_system_owner_required", "gls_opportunity_required", "pilot_stage_transition_not_allowed", "pilot_qualification_incomplete", "pilot_readiness_incomplete", "pilot_cohort_required", "pilot_facilitator_required", "pilot_implementation_owner_required", "pilot_safety_contact_required", "pilot_executed_agreement_required", "pilot_commercial_authority_required", "pilot_evidence_required", "pilot_closeout_required", "pilot_metric_integrity_failed", "pilot_closeout_stage_required", "pilot_permission_reference_required",'
          if old2 not in s: raise SystemExit('pilot conflict error anchor not found')
          p.write_text(s.replace(old2,new2))
          PY
          rm .github/workflows/v3-11-error-map-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/credentials/store.ts .github/workflows/v3-11-error-map-sync.yml
          git commit -m "Map v3.11 pilot lifecycle and evidence errors"
          git push origin HEAD:zgirl-v3.11-operational-activation-pilot-engine

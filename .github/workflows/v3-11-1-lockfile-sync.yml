name: v3.11.1 Lockfile Sync

on:
  push:
    branches:
      - zgirl-v3.11.1-first-owner-bootstrap
    paths:
      - .github/workflows/v3-11-1-lockfile-sync.yml

permissions:
  contents: write

jobs:
  sync:
    name: Regenerate and commit package-lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: zgirl-v3.11.1-first-owner-bootstrap
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Remove one-time workflow and commit lockfile
        shell: bash
        run: |
          rm .github/workflows/v3-11-1-lockfile-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/v3-11-1-lockfile-sync.yml
          git diff --cached --quiet && exit 1
          git commit -m "Regenerate package-lock for Z-Girl v3.11.1"
          git push origin HEAD:zgirl-v3.11.1-first-owner-bootstrap

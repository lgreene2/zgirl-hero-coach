name: v3.11 Migration Source Fix

on:
  push:
    branches:
      - zgirl-v3.11-operational-activation-pilot-engine
    paths:
      - .github/workflows/v3-11-migration-source-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zgirl-v3.11-operational-activation-pilot-engine
      - name: Remove obsolete local migration-registry insert
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/migrations/20260816_zgirl_operational_activation_pilot_engine_v3_11.sql')
          s=p.read_text()
          needle="insert into public.zgirl_credential_migrations(name) values('zgirl_operational_activation_pilot_engine_v3_11') on conflict(name) do nothing;\n"
          if needle not in s:
              raise SystemExit('obsolete registry insert not found')
          p.write_text(s.replace(needle,''))
          PY
          rm .github/workflows/v3-11-migration-source-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260816_zgirl_operational_activation_pilot_engine_v3_11.sql .github/workflows/v3-11-migration-source-fix.yml
          git commit -m "Fix v3.11 migration bookkeeping for clean environments"
          git push origin HEAD:zgirl-v3.11-operational-activation-pilot-engine

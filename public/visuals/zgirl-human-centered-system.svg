<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Z-Girl human-centered support system</title><desc id="desc">An illustrated visual showing a young person at the center with supportive adults around her, including a parent, coach, educator, counselor, faith leader, and mentor.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061521"/><stop offset="1" stop-color="#13283b"/></linearGradient><linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#49d8c2"/><stop offset="1" stop-color="#9a7cff"/></linearGradient></defs><rect width="1600" height="900" rx="48" fill="url(#bg)"/><circle cx="800" cy="420" r="155" fill="#17354a" stroke="#76ead6" stroke-width="5"/><circle cx="800" cy="365" r="58" fill="#d59b77"/><path d="M690 535c25-100 195-100 220 0" fill="#5c3aa8"/><text x="800" y="610" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">YOU</text><text x="800" y="655" text-anchor="middle" fill="#9af3e4" font-family="Arial,sans-serif" font-size="24">Your story. Your control.</text><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(260 215)"><circle r="92" fill="#23394d" stroke="#49d8c2" stroke-width="3"/><circle cy="-20" r="30" fill="#c88464"/><path d="M-50 58c12-65 88-65 100 0" fill="#7f4b91"/><text y="125" fill="#fff" font-size="28" font-weight="700">Parent</text></g><g transform="translate(520 145)"><circle r="92" fill="#23394d" stroke="#49d8c2" stroke-width="3"/><circle cy="-20" r="30" fill="#7a4d33"/><path d="M-50 58c12-65 88-65 100 0" fill="#203f6a"/><text y="125" fill="#fff" font-size="28" font-weight="700">Coach</text></g><g transform="translate(1080 145)"><circle r="92" fill="#23394d" stroke="#49d8c2" stroke-width="3"/><circle cy="-20" r="30" fill="#ad6f54"/><path d="M-50 58c12-65 88-65 100 0" fill="#5c6b7a"/><text y="125" fill="#fff" font-size="28" font-weight="700">Educator</text></g><g transform="translate(1340 215)"><circle r="92" fill="#23394d" stroke="#49d8c2" stroke-width="3"/><circle cy="-20" r="30" fill="#d5a07c"/><path d="M-50 58c12-65 88-65 100 0" fill="#4b4f63"/><text y="125" fill="#fff" font-size="28" font-weight="700">Counselor</text></g><g transform="translate(365 690)"><circle r="92" fill="#23394d" stroke="#49d8c2" stroke-width="3"/><circle cy="-20" r="30" fill="#6d422f"/><path d="M-50 58c12-65 88-65 100 0" fill="#2f2a52"/><text y="125" fill="#fff" font-size="28" font-weight="700">Faith Leader</text></g><g transform="translate(1235 690)"><circle r="92" fill="#23394d" stroke="#49d8c2" stroke-width="3"/><circle cy="-20" r="30" fill="#bd7f5f"/><path d="M-50 58c12-65 88-65 100 0" fill="#35645b"/><text y="125" fill="#fff" font-size="28" font-weight="700">Mentor</text></g></g><g stroke="url(#glow)" stroke-width="8" stroke-linecap="round" opacity=".8"><path d="M340 260L675 370"/><path d="M585 220L705 320"/><path d="M1015 220L895 320"/><path d="M1260 260L925 370"/><path d="M440 635L695 520"/><path d="M1160 635L905 520"/></g><text x="800" y="80" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="56" font-weight="800">AI-Powered Reflection. Human Support.</text><text x="800" y="120" text-anchor="middle" fill="#a7b7c7" font-family="Arial,sans-serif" font-size="24">Z-Girl adapts the experience while trusted people remain in charge of the relationship.</text></svg>